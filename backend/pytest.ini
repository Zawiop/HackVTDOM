[pytest]
pythonpath = .
testpaths = tests
# Live tests call the real HF Spaces / Gemini through a running server; opt in with -m live.
addopts = -m "not live and not heavy"
markers =
    live: hits the running API server and the real external providers (needs network + HF quota)
    heavy: runs local ML models (TripoSR, ~1.7 GB weights; rembg cutout)
