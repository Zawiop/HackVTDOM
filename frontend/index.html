<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060505" />
    <title>Scorched Earth — see any building after the end</title>
    <meta
      name="description"
      content="Photograph a real building, choose how the world ends for it, and watch the ruin rise on a live map at its exact footprint and scale. A companion instrument for Scorched Nebraska."
    />

    <!-- Link previews. Relative image so it follows whatever host this lands on. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Scorched Earth" />
    <meta
      property="og:description"
      content="Photograph a real building, choose how the world ends for it, and watch the ruin rise on a live map at its exact footprint and scale."
    />
    <meta property="og:image" content="/favicon.svg" />
    <meta name="twitter:card" content="summary" />

    <!--
      The document starts on the landing page's ground so a slow first paint is
      black rather than a white flash, and `data-route` is set before the
      bundle runs so the scroll layout is right on the very first frame.
      main.tsx re-applies it once the router is live.
    -->
    <script>
      document.documentElement.dataset.route = /\/map\/?$/.test(location.pathname)
        ? "map"
        : "home";
    </script>
    <style>
      html, body { background: #060505; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding:2rem;font:16px system-ui;color:#f4eee7;background:#060505">
        <h1>Scorched Earth</h1>
        <p>This map needs JavaScript enabled to render buildings in 3D.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
